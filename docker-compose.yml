services:
  # PostgreSQL database for CTFd
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctfd
      POSTGRES_USER: ctfd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctfd_heist_2024}
    volumes:
      - ctfd_db:/var/lib/postgresql/data
    networks:
      - ctfd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfd -d ctfd"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache for CTFd
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - ctfd_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # CTFd backend
  ctfd:
    image: ctfd/ctfd:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://ctfd:${POSTGRES_PASSWORD:-ctfd_heist_2024}@db:5432/ctfd
      - REDIS_URL=redis://cache:6379
      - SECRET_KEY=${CTFD_SECRET_KEY:-change_this_secret_key_before_production}
      - WORKERS=4
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - ctfd_uploads:/var/uploads
      - ctfd_logs:/var/log/CTFd
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - ctfd_network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/settings"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Nginx reverse proxy — serves React SPA + forwards /api to CTFd
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ctfd_uploads:/var/uploads:ro
    depends_on:
      - ctfd
    networks:
      - ctfd_network

volumes:
  ctfd_db:
  ctfd_uploads:
  ctfd_logs:

networks:
  ctfd_network:
    driver: bridge
