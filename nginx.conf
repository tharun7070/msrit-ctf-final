worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Rate limiting — protect CTFd submission endpoint
    limit_req_zone $binary_remote_addr zone=submit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/m;

    upstream ctfd_backend {
        server ctfd:8000;
        keepalive 10;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Serve React SPA — all unknown routes fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static assets — long cache
        location ~* \.(woff|woff2|webp|png|jpg|svg|mp4|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # JS/CSS chunks — cache busting via Vite hashes
        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # CTFd API — forward with auth cookie passthrough
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://ctfd_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass_header  Set-Cookie;
            proxy_cookie_flags ~ secure samesite=lax;
        }

        # Challenge submission — extra rate limit
        location = /api/v1/challenges/attempt {
            limit_req zone=submit burst=3 nodelay;
            proxy_pass         http://ctfd_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass_header  Set-Cookie;
        }

        # CTFd auth routes
        location ~ ^/(login|logout|register|oauth)$ {
            proxy_pass         http://ctfd_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass_header  Set-Cookie;
        }

        # CTFd challenge file downloads — served by CTFd (not direct filesystem access)
        location /files/ {
            proxy_pass         http://ctfd_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # Block organizer private files — belt-and-suspenders
        location ~ ^/(organizer_private|ANSWER_KEY|private_flags|CHALLENGE_SOURCE) {
            return 403;
        }
    }
}
