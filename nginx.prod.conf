# FLAG THEFT AUTO — PRODUCTION nginx config (TLS via Let's Encrypt / certbot).
#
# This file is rendered as an nginx *template*: the nginx:alpine entrypoint runs
# `envsubst` over it and only substitutes variables that exist in the
# environment. ${DOMAIN} therefore comes from .env; nginx run-time variables
# ($host, $remote_addr, $scheme, ...) are left untouched.
#
# Certificate paths below match certbot's default layout:
#   /etc/letsencrypt/live/${DOMAIN}/fullchain.pem
#   /etc/letsencrypt/live/${DOMAIN}/privkey.pem
# Renew/issue the cert on the HOST, then `docker compose ... restart nginx`.
#
# Use with the production stack:
#   docker compose -f docker-compose.prod.yml up -d --build

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Rate limiting — protect CTFd submission endpoint
    limit_req_zone $binary_remote_addr zone=submit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/m;

    upstream ctfd_backend {
        server ctfd:8000;
        keepalive 10;
    }

    # ── HTTP :80 — serve ACME challenges, redirect everything else to HTTPS ──
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 webroot. Issue/renew with:
        #   certbot certonly --webroot -w <host certbot-www dir> -d ${DOMAIN}
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS :443 — TLS terminated here ──
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers (HSTS is safe now that TLS is terminated here)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Serve React SPA — all unknown routes fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # BONUS WAVE artifacts stay off the predictable static path until reveal.
        # They are delivered through CTFd's randomized /files/ URLs once the
        # challenge is visible (a hidden challenge never exposes its file links).
        location ^~ /challenges/BONUS/ {
            return 403;
        }

        # CTFd setup, admin panel, and settings (Access Tokens)
        location ~ ^/(setup|admin|themes|settings) {
            proxy_pass         http://ctfd_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass_header  Set-Cookie;
            proxy_cookie_flags ~ secure samesite=lax;
        }

        # Static assets — long cache
        location ~* \.(woff|woff2|webp|png|jpg|svg|mp4|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # JS/CSS chunks — cache busting via Vite hashes
        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # CTFd API — forward with auth cookie passthrough
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://ctfd_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass_header  Set-Cookie;
            proxy_cookie_flags ~ secure samesite=lax;
        }

        # Challenge submission — extra rate limit
        location = /api/v1/challenges/attempt {
            limit_req zone=submit burst=3 nodelay;
            proxy_pass         http://ctfd_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass_header  Set-Cookie;
        }

        # CTFd auth routes
        location ~ ^/(login|logout|register|oauth)$ {
            proxy_pass         http://ctfd_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass_header  Set-Cookie;
        }

        # CTFd challenge file downloads — served by CTFd (not direct filesystem access)
        # ^~ ensures image files under /files/ (.png, .jpg, etc.) aren't hijacked by the static-asset regex above
        location ^~ /files/ {
            proxy_pass         http://ctfd_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Block organizer private files — belt-and-suspenders
        location ~ ^/(organizer_private|ANSWER_KEY|private_flags|CHALLENGE_SOURCE) {
            return 403;
        }
    }
}
